# Free-tier Supabase pauses a project after 7 days without activity, and an
# idle Atlas M0 cluster pauses after 60 days. This makes a few small real
# database reads every 2 days so neither happens while the app is quiet.
name: Keep services awake

on:
  schedule:
    - cron: '23 2 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Query Supabase storage and auth (Postgres reads)
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY repo secrets"; exit 1
          fi
          call() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --max-time 30 \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" "$@")
            echo "$code ${*: -1}"
            [ "$code" = 200 ]
          }
          call -X POST -H 'Content-Type: application/json' -d '{"prefix":"","limit":1}' "$SUPABASE_URL/storage/v1/object/list/trustify"
          call "$SUPABASE_URL/storage/v1/bucket"
          call "$SUPABASE_URL/auth/v1/admin/users?page=1&per_page=1"

      - name: Wake the API and check MongoDB
        run: |
          set -euo pipefail
          # Render free instances can take about a minute to start.
          body=$(curl -sS --retry 5 --retry-all-errors --retry-delay 20 --max-time 120 https://trustify-api-ar4i.onrender.com/health)
          echo "$body"
          echo "$body" | grep -q '"db":true'
